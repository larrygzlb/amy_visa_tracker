name: Visa check

# Triggered every 30 minutes by cron-job.org through the GitHub API (workflow_dispatch).
# GitHub's own `schedule` trigger is not used: it skipped most runs for this repo.
on:
  workflow_dispatch:          # API calls from cron-job.org, and the "Run workflow" button

# Never run two checks at once; a trigger that arrives during a run waits for it
concurrency:
  group: visa-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04     # pinned: ubuntu-latest moves to Ubuntu 26 on 2026-10-19
    timeout-minutes: 15
    env:
      TZ: Asia/Shanghai       # timestamps in the notification use China time
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: false   # no lock/requirements file to key a cache on

      - name: Install Chromium
        run: uv run --with playwright python -m playwright install --with-deps chromium

      - name: Write .env from the ENV_FILE secret
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ -z "$ENV_FILE" ]; then echo "The ENV_FILE secret is not set" >&2; exit 1; fi
          printf '%s\n' "$ENV_FILE" > .env

      - name: Run check
        run: ./check_once.sh
